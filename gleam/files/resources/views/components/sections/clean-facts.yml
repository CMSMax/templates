title: Clean Facts
description: The cleaning checklist typeset like a nutrition label, with a tick for each kind of clean, beside a short explanation.
fields:
    eyebrow: { type: text, label: Small line above the heading }
    heading: { type: text, label: Heading }
    body: { type: textarea, label: Supporting copy, rows: 3 }
    note: { type: textarea, label: Second paragraph, rows: 2 }
    labelTitle: { type: text, label: Label title }
    servingSize: { type: text, label: Serving size }
    timeOnSite: { type: text, label: Time on site }
    footnote: { type: textarea, label: Footnote, rows: 2 }
    image: { type: image, label: Photo }
    imageAlt: { type: text, label: Photo description }
    items: { type: repeater, label: Checklist, source: checklist, item_label: task, sub_fields: { room: { type: text, label: Room }, task: { type: text, label: Task }, standard: { type: toggle, label: Regular clean }, deep: { type: toggle, label: Deep clean }, move_out: { type: toggle, label: Move-out clean } } }
