title: Story
description: How the company started, in two paragraphs, a photograph and one line worth quoting.
fields:
    heading:
        type: text
        label: Headline
        default: Two technicians, one van, and a list that kept growing.
    bodyOne:
        type: textarea
        label: First paragraph
        rows: 4
        default: Lantern began in 2012 with heating work on the streets around Fairbank Road. Customers kept asking whether we also did the leak in the basement, then the panel in the garage, then the deck rail nobody wanted to climb.
    bodyTwo:
        type: textarea
        label: Second paragraph
        rows: 4
        default: Rather than hand people a phone number for someone else, we hired the licence. Fourteen years later there are nine of us, still on the same streets, still answering the same number.
    image:
        type: image
        label: Photograph
        default: /images/crew.jpg
    imageAlt:
        type: text
        label: Photograph description
        default: Two Lantern technicians standing beside their van in a driveway on a bright morning
    quote:
        type: textarea
        label: Pull quote
        rows: 3
        default: We would rather lose a job than sell you a system you do not need. That rule has kept us busy for fourteen years.
    quoteName:
        type: text
        label: Who said it
        default: Ray Okonkwo, founder
