    heading: { type: text, label: Headline }
    body: { type: textarea, label: Supporting copy, rows: 3 }
    loadLabel: { type: text, label: Word read aloud before each load }
    plan:
        type: repeater
        label: Phases
        source: site.plan
        item_label: title
        sub_fields:
